name: Culler
options:
  bundleIdPrefix: de.wollschlaeger
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    # Daniel Wollschläger's Apple Developer team (from the signing certificate).
    DEVELOPMENT_TEAM: 8LV3888LLM
targets:
  Culler:
    type: application
    platform: iOS
    sources:
      - path: Culler
    info:
      path: Culler/Info.plist
      properties:
        CFBundleDisplayName: Selecta
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: "Selecta adds the photos you export to an album in your Photos library, if you ask it to."
        NSPhotoLibraryUsageDescription: "Selecta reads your library only to import the albums you choose for culling, and adds photos only when you use 'Add to Photos album' during export."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wollschlaeger.culler
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CullerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CullerTests
    dependencies:
      - target: Culler
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SelectaMac:
    type: application
    platform: macOS
    sources:
      - path: Culler/Models
      - path: Culler/Services
        excludes:
          - PhotosImport.swift
          - ShareService.swift
      - path: CullerMac
    info:
      path: CullerMac/Info.plist
      properties:
        CFBundleDisplayName: Selecta
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSPhotoLibraryUsageDescription: "Selecta reads your library only to import the albums you choose for culling, and adds photos only when you use \"Add to Photos album\" during export."
        NSPhotoLibraryAddUsageDescription: "Selecta adds the photos you export to an album in your Photos library, if you ask it to."
        NSHumanReadableCopyright: "© Daniel Wollschläger"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.wollschlaeger.selecta.mac
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Culler:
    build:
      targets:
        Culler: all
        CullerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CullerTests
  SelectaMac:
    build:
      targets:
        SelectaMac: all
    run:
      config: Debug
